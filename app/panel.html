<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
:root{--paper:#F5F6F2;--ink:#22261F;--mut:#767C70;--line:#E2E4DB;

html,body{margin:0;background:var(--paper);color:var(--ink);

"Apple SD Gothic Neo",sans-serif;height:100%;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding:8px 16px 10px}

header h1{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0}

#back,#pback{border:0;background:none;cursor:pointer;font-size:16px;

main{flex:1;overflow-y:auto;padding:0 2px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line)}
.card .row:first-child,.card .empty:first-child,.card .zerostate:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row.grab{cursor:grab}
.row .hd{width:10px;flex:none;color:#B9BEB5;font-size:12px;letter-spacing:-2px;opacity:0;
margin-left:-4px;user-select:none;cursor:grab}
.row:hover .hd{opacity:1}
.row.dragging{opacity:.45;cursor:grabbing}
.row.dragging .act{display:none}
.acc{border:0;background:none;padding:0;width:14px;flex:none;color:var(--mut);cursor:pointer;font-size:10px;line-height:1}
.acc:hover{color:var(--ink)}
.subn{font-size:10.5px;color:var(--mut);flex:none;font-variant-numeric:tabular-nums;cursor:pointer}
.subs{border-top:1px solid var(--line);background:var(--paper);padding:2px 0 6px}
.subg{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:8px 10px 2px 52px}
.row.sub{border-top:0;padding:3px 10px 3px 50px;gap:7px;font-size:12px}
.row.sub .t{white-space:normal;line-height:1.35}
.row.sub .chk{width:13px;height:13px}.row.sub .chk.on::after{left:3.3px;top:1px;width:3px;height:6.5px}
.row.sub.err .t{color:#C05B4D}
.drop-line{height:0;border-top:2px solid var(--acc);margin:0 10px}
#calref{cursor:pointer;margin-left:2px}#calref:hover{color:var(--ink)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
white-space:nowrap}
.row .t[contenteditable="true"]{white-space:normal;outline:none;
background:#fff;border-radius:4px;padding:1px 5px;-webkit-user-select:text;
user-select:text}
.row.done .t{color:var(--mut);text-decoration:line-through}
.chk{width:16px;height:16px;flex:none;border:1.5px solid #A9AFA2;
border-radius:50%;background:none;cursor:pointer;padding:0}
.chk.on{background:var(--acc);border-color:var(--acc);position:relative}
.chk.on::after{content:"";position:absolute;left:4.5px;top:2px;width:4px;
height:8px;border:solid #fff;border-width:0 1.8px 1.8px 0;
transform:rotate(42deg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.clab{font-size:10.5px;color:var(--mut);flex:none;max-width:56px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.act{display:none;gap:2px}.row:hover .act{display:flex}
.act button{border:0;background:none;cursor:pointer;font-size:12px;
padding:2px 3px;color:var(--mut);border-radius:5px}
.act button:hover{background:#fff;color:var(--ink)}
.time{font-size:11.5px;color:var(--mut);width:38px;flex:none;
font-variant-numeric:tabular-nums}
.empty{color:var(--mut);font-size:12.5px;padding:9px 12px}
.zerostate{display:flex;flex-direction:column;align-items:center;padding:12px 0 6px;
gap:2px;padding:10px 0 4px}
.zerostate img{height:88px;opacity:.92}
#connect{margin:0 12px 10px;border:1px solid var(--line);background:var(--soft);border-radius:8px;
padding:7px 10px;font:inherit;font-size:12.5px;cursor:pointer;width:100%}
#connect:hover{border-color:var(--acc);color:var(--acc)}
.err{color:#A34040;font-size:11.5px;padding:9px 12px 4px;word-break:break-all}
#addbox{padding:8px 2px 2px}
#chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.chip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);
background:#fff;border-radius:20px;padding:2.5px 9px;font-size:11px;
cursor:pointer;color:var(--mut)}
.chip.sel{border-color:var(--ink);color:var(--ink);font-weight:600}
#addrow{display:flex;gap:0;align-items:stretch;overflow:visible}
#catsel{font:inherit;font-size:12px;border:0;border-right:1px solid var(--line);
border-radius:0;background:transparent;padding:0 6px;max-width:96px;color:var(--ink)}
.catmenu{position:fixed;z-index:99;background:#fff;border:1px solid var(--line);
border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:4px;
min-width:118px}
.citem{display:flex;align-items:center;gap:7px;padding:5px 9px;
border-radius:6px;font-size:12px;cursor:pointer}
.citem:hover{background:var(--soft)}.citem.cur{font-weight:600}
#inp{flex:1;border:0;border-radius:0;
padding:9px 10px;font:inherit;background:transparent;outline:none;
-webkit-user-select:text;user-select:text}
#addrow:focus-within{border-color:var(--acc)}
footer{display:flex;justify-content:center;gap:16px;padding:8px 6px 2px;
font-size:11px;color:var(--mut)}
footer span{cursor:pointer}footer span:hover{color:var(--ink)}
#set[hidden],#pomo[hidden]{display:none!important}
#pomob,#gear{border:0;background:none;cursor:pointer;font-size:15px;
line-height:1;width:24px;height:24px;display:grid;place-items:center;
padding:0;color:var(--mut);border-radius:6px}
#pomob:hover{color:var(--ink);background:var(--soft)}
#pomo{position:absolute;inset:0;background:var(--paper);z-index:9;
padding:30px 14px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px 16px}
#pcatwrap{position:relative;display:inline-block;margin:0 0 -4px}
#pcat{height:118px;display:block;transform-origin:50% 90%}
#pcat.zen{animation:zensway 3.2s ease-in-out infinite}
@keyframes zensway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.note{position:absolute;left:8px;bottom:56px;font-size:13px;color:var(--acc);
opacity:0;pointer-events:none}
#pcatwrap.zen .note{animation:notefloat 3s ease-out infinite}
#pcatwrap.zen .n2{animation-delay:1s;left:2px}#pcatwrap.zen .n3{animation-delay:2s;left:14px}
@keyframes notefloat{0%{opacity:0;transform:translate(0,0) scale(.8)}
20%{opacity:.85}100%{opacity:0;transform:translate(-14px,-34px) scale(1.1)}}
#pmode{font-size:12px;font-weight:600;color:var(--mut);
letter-spacing:.06em;text-transform:uppercase}
#ptime{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;
letter-spacing:-.02em;margin:2px 0 6px}
.pbtns{display:flex;gap:8px}
.pbtns button{font-size:17px;line-height:1;border:1px solid var(--line);
background:#fff;border-radius:22px;padding:10px 22px;cursor:pointer}
.pbtns button:hover{border-color:var(--acc);color:var(--acc)}
#pstart{background:var(--acc);color:#fff;border-color:var(--acc)}
#pstart:hover{color:#fff;opacity:.9}
#sndplay{border:1px solid var(--line);background:#fff;border-radius:7px;width:26px;height:24px;
cursor:pointer;font-size:11px;color:var(--mut);padding:0}#sndplay:hover{color:var(--acc);border-color:var(--acc)}
#sndsel,#pwsel,#pbsel{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:2px 4px;color:var(--ink)}
.mn{font-size:11px;color:var(--mut)}
#pcount{color:var(--ink);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
#set{position:absolute;inset:0;background:var(--paper);z-index:9;
padding:30px 14px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sethead{display:flex;align-items:center;gap:6px;margin-bottom:2px}
#set h2{font-size:14px;color:var(--ink);margin:0}
.gh{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
color:var(--mut);margin:4px 6px 5px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;
padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.card .srow:first-child{border-top:0}
.rl{display:flex;flex-direction:column;min-width:0;flex:1}
.rl b{font-size:12.5px;font-weight:600;color:var(--ink)}
.rl small{font-size:11px;color:var(--mut);line-height:1.35;margin-top:1px}
.rc{display:flex;align-items:center;gap:6px;flex:none}
.seg{display:flex;background:var(--soft);border-radius:8px;padding:2px;flex:none}
.seg span{padding:3px 9px;font-size:11.5px;border-radius:6px;cursor:pointer;color:var(--mut)}
.seg span.sel{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tg{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;
background:#C9CDC4;position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.tg:checked{background:var(--acc)}.tg:checked::after{left:16px}
#op{width:104px;accent-color:var(--acc)}
.srow.col{flex-direction:column;align-items:stretch;gap:6px}
.txt{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:6px;padding:5px 7px;
background:var(--paper);color:var(--ink);min-width:0}
#uxsync{font-size:11.5px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:3px 9px;cursor:pointer;flex:none}

::-webkit-scrollbar{width:0}

// ── drag to reorder (open list) ──
(function(){
const list=document.getElementById("open");let drag=null,line=null,startY=0,started=false;
function rows(){return [...list.querySelectorAll(".row.grab")]}
list.addEventListener("pointerdown",e=>{
if(e.button!==0||e.target.closest("button,input,select,[contenteditable=true],.dot,.clab,.act"))return;
const r=e.target.closest(".row.grab");if(!r)return;
drag=r;startY=e.clientY;started=false;r.setPointerCapture(e.pointerId)});
// a to-do's open checks (.subs) travel with it; the drop line never lands between a to-do and its checks

list.addEventListener("pointermove",e=>{
if(!drag)return;
if(!started){if(Math.abs(e.clientY-startY)<4)return;started=true;drag.classList.add("dragging");
line=el("div","drop-line");document.body.style.cursor="grabbing"}
const others=rows().filter(x=>x!==drag);let target=null;
for(const x of others){const b=x.getBoundingClientRect();if(e.clientY<b.top+b.height/2){target=x;break}}
line.remove();if(target)list.insertBefore(line,target);else list.appendChild(line)});
function finish(e){
if(!drag)return;
const wasStarted=started;const d=drag;drag=null;started=false;document.body.style.cursor="";
d.classList.remove("dragging");
if(wasStarted&&line){list.insertBefore(d,line);if(d._subs)d.after(d._subs);line.remove();line=null;
post({action:"reorder",ids:rows().map(x=>+x.dataset.id)})}
else if(line){line.remove();line=null}}
list.addEventListener("pointerup",finish);list.addEventListener("pointercancel",finish);
})();
